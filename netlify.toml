[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Same-origin reverse proxy — browser Network tab shows jointavrion.com/api/sb/*, not *.supabase.co
[[redirects]]
  from = "/api/sb/*"
  to = "https://jilehijfjayayfumbrsl.supabase.co/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/sb"
  to = "https://jilehijfjayayfumbrsl.supabase.co/"
  status = 200
  force = true

# SPA fallback lives in public/_redirects (known routes → index.html, else 404).

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "text/xml; charset=utf-8"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/lms"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/api/sb/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
