<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Tavrion</title>
    <meta name="description" content="This page does not exist on Tavrion." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #fff;
        color: #171717;
        display: flex;
        flex-direction: column;
        padding: 28px 24px 48px;
        box-sizing: border-box;
      }
      a { color: inherit; }
      .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; width: fit-content; font-weight: 700; letter-spacing: -0.03em; font-size: 18px; }
      .mark { width: 32px; height: 32px; border-radius: 8px; background: #171717; color: #fff; display: grid; place-items: center; font-size: 16px; }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 520px; margin: 0 auto; width: 100%; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #808080; margin: 0 0 12px; }
      h1 { font-size: clamp(32px, 5vw, 44px); font-weight: 750; letter-spacing: -0.04em; line-height: 1.1; margin: 0 0 12px; }
      p { font-size: 16px; color: #666; line-height: 1.6; margin: 0 0 28px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      .primary, .secondary { padding: 10px 18px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 600; }
      .primary { background: #171717; color: #fff; }
      .secondary { background: #fff; color: #171717; box-shadow: inset 0 0 0 1px #ebebeb; }
    </style>
  </head>
  <body>
    <a class="logo" href="/"><span class="mark">T</span> Tavrion</a>
    <main>
      <p class="kicker">404</p>
      <h1>Page not found</h1>
      <p>That URL is not a page on Tavrion. Head back to the homepage to learn about the platform, or sign in if you already have an account.</p>
      <div class="row">
        <a class="primary" href="/">Go to homepage</a>
        <a class="secondary" href="/login">Sign in</a>
      </div>
    </main>
  </body>
</html>
